<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas · Centro Médico Belén</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menú">☰</button>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-logo">CB</div>
                <div class="sidebar-brand-text">
                    <h2>Centro Médico<br>Belén</h2>
                    <span>Panel Administrativo</span>
                </div>
            </div>

            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="sidebarAvatar">A</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUser">Usuario</div>
                    <div class="sidebar-user-role">Administrador</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-nav-section">Principal</div>
                <a class="nav-item" href="index.html">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a class="nav-item active" href="empresas.html">
                    <span class="nav-icon">🏢</span> Empresas
                </a>
                <a class="nav-item" href="trabajadores.html">
                    <span class="nav-icon">👷</span> Trabajadores
                </a>
                <a class="nav-item" href="usuarios.html">
                    <span class="nav-icon">👤</span> Usuarios
                </a>

                <div class="sidebar-nav-section">Documentos</div>
                <a class="nav-item" href="../archivos/index.html">
                    <span class="nav-icon">📁</span> Subir Archivos
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-header-left">
                    <h1>Gestión de Empresas</h1>
                    <p>Administra las empresas registradas en el sistema</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" id="btnNewCompany">
                        <span>+</span> Nueva Empresa
                    </button>
                </div>
            </div>

            <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

            <div class="companies-grid" id="companiesGrid"></div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Nueva Empresa</h3>
            <form id="modalForm">
                <div class="form-group">
                    <label for="f_nombre">Nombre de la empresa</label>
                    <input type="text" id="f_nombre" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="f_ruc">RUC (11 dígitos)</label>
                    <input type="text" id="f_ruc" class="form-control" maxlength="11" pattern="[0-9]{11}" title="Debe tener 11 dígitos numéricos" required>
                </div>
                <div class="form-group">
                    <label for="f_dir">Dirección</label>
                    <input type="text" id="f_dir" class="form-control" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var SERVICE_ROLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtcXF5YnpucHlwZHdmc2N1emR1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDA0NjI3NywiZXhwIjoyMDk5NjIyMjc3fQ.lwY-bTlP_0cQuIxVbWu45V3VQj_ftfBc1b2IlsXYatA';
        var editingId = null;

        function authHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SERVICE_ROLE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            };
        }

        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'flex';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

        async function renderCompanies() {
            var grid = document.getElementById('companiesGrid');
            grid.innerHTML = '';
            var res = await supabase.from('empresas').select('*').order('id', { ascending: true });
            if (res.error) { grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🏢</div><h3>Error al cargar empresas</h3><p>' + escHtml(res.error.message) + '</p></div>'; return; }
            var data = res.data || [];
            if (!data.length) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🏢</div><h3>Aquí puedes agregar empresas</h3><p>Aún no se han registrado empresas. Presiona el botón para crear la primera.</p><button class="btn btn-primary" onclick="openModal()">Nueva Empresa</button></div>';
                return;
            }

            await Promise.all(data.map(async function (e) {
                var usersCount = 0, trabCount = 0;
                try {
                    var u = await supabase.from('usuarios').select('id').eq('empresa_id', e.id);
                    usersCount = (u && u.data) ? u.data.length : 0;
                } catch (_) { usersCount = 0; }
                try {
                    var t = await supabase.from('trabajadores').select('id').eq('empresa_id', e.id);
                    trabCount = (t && t.data) ? t.data.length : 0;
                } catch (_) { trabCount = 0; }

                var html = '<div class="company-card">'
                    + '<div class="card-top">'
                        + '<div class="logo">🏢</div>'
                        + '<span class="badge">ACTIVA</span>'
                    + '</div>'
                    + '<div class="card-body">'
                        + '<h3>' + escHtml(e.nombre) + '</h3>'
                        + '<div class="field"><strong>RUC</strong><div class="value">' + escHtml(e.ruc || '-') + '</div></div>'
                        + '<div class="field"><strong>DIRECCIÓN</strong><div class="value">' + escHtml(e.direccion || '-') + '</div></div>'
                        + '<div style="color:#94a3b8;font-size:12px;margin-top:4px;">Creada: ' + (e.created_at ? new Date(e.created_at).toLocaleDateString() : '-') + '</div>'
                        + '<div class="stats">'
                            + '<div class="mini-stat"><div class="ico">👤</div><div><div class="num">' + usersCount + '</div><div style="font-size:11px;color:#94a3b8;">USUARIOS</div></div></div>'
                            + '<div class="mini-stat"><div class="ico">👥</div><div><div class="num">' + trabCount + '</div><div style="font-size:11px;color:#94a3b8;">TRABAJADORES</div></div></div>'
                        + '</div>'
                        + '<div class="actions">'
                            + '<button class="btn-edit" onclick="editar(' + e.id + ')">✏️ Editar</button>'
                            + '<button class="btn-delete" onclick="eliminar(' + e.id + ')">🗑️ Eliminar</button>'
                        + '</div>'
                    + '</div>'
                + '</div>';

                var div = document.createElement('div'); div.innerHTML = html;
                grid.appendChild(div.firstChild);
            }));
        }

        function openModal(data) {
            editingId = data ? data.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = data ? 'Editar Empresa' : 'Nueva Empresa';
            document.getElementById('modalSubmit').textContent = data ? 'Guardar cambios' : 'Crear empresa';
            document.getElementById('f_nombre').value = data ? data.nombre : '';
            document.getElementById('f_ruc').value = data ? (data.ruc || '') : '';
            document.getElementById('f_dir').value = data ? (data.direccion || '') : '';
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

        document.getElementById('modalForm').addEventListener('submit', async function (ev) {
            ev.preventDefault();
            var btn = document.getElementById('modalSubmit'); btn.disabled = true; btn.textContent = 'Guardando...';
            try {
                var nombre = document.getElementById('f_nombre').value.trim();
                var ruc = document.getElementById('f_ruc').value.trim();
                var dir = document.getElementById('f_dir').value.trim();
                if (!nombre) { showAlert('El nombre es obligatorio'); btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear empresa'; return; }
                if (ruc && ruc.length !== 11) { showAlert('El RUC debe tener 11 dígitos'); btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear empresa'; return; }

                var url = SUPABASE_URL + '/rest/v1/empresas';
                if (editingId) {
                    url += '?id=eq.' + editingId;
                    var res = await fetch(url, {
                        method: 'PATCH',
                        headers: authHeaders(),
                        body: JSON.stringify({ nombre: nombre, ruc: ruc, direccion: dir })
                    });
                    if (!res.ok) { var e = await res.json(); throw new Error(e.message || 'Error al actualizar'); }
                    showAlert('Empresa actualizada correctamente', 'success');
                } else {
                    var res = await fetch(url, {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({ nombre: nombre, ruc: ruc, direccion: dir })
                    });
                    if (!res.ok) { var e = await res.json(); throw new Error(e.message || 'Error al crear'); }
                    showAlert('Empresa creada correctamente', 'success');
                }
                closeModal(); renderCompanies();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); } finally { btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear empresa'; }
        });

        async function editar(id) {
            var r = await supabase.from('empresas').select('*').eq('id', id).single();
            if (r.error) { showAlert('Error al cargar'); return; }
            openModal(r.data);
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar esta empresa?\nLos trabajadores asociados quedarán sin empresa.')) return;
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/empresas?id=eq.' + id, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (!res.ok) { var e = await res.json(); throw new Error(e.message || 'Error al eliminar'); }
                showAlert('Empresa eliminada', 'success'); renderCompanies();
            } catch (e) { showAlert('Error: ' + (e.message || 'Desconocido')); }
        }

        (async function () {
            var session = await checkAuth(); if (!session) return;
            var profile = await getUserProfile(); if (!profile || profile.rol_id !== 1) { window.location.href = '/index.html'; return; }
            document.getElementById('sidebarUser').textContent = profile.usuario;
            document.getElementById('sidebarAvatar').textContent = profile.usuario.charAt(0).toUpperCase();
            var btn = document.getElementById('btnNewCompany'); if (btn) btn.addEventListener('click', function(){ openModal(); });
            document.getElementById('sidebarToggle').addEventListener('click', function () {
                document.getElementById('sidebar').classList.toggle('open');
            });
            renderCompanies();
        })();
    </script>
</body>
</html>
