<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Empresas</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
    <style>
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 90%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .modal h3 { color: #203a43; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .modal input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { width: auto; padding: 10px 24px; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-cancel:hover { background: #ddd; }
        .btn-delete { background: #c0392b; color: white; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
        .btn-delete:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand"><div style="width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-weight:800;">A</div> Archivos</div>
            <div style="font-size:13px; opacity:0.85;">Centro Médico Belén</div>
            <nav>
                <a class="nav-item" href="index.html"><span class="icon">🏠</span> <span>Dashboard</span></a>
                <a class="nav-item" href="trabajadores.html"><span class="icon">👷</span> <span>Trabajadores</span></a>
                <a class="nav-item" href="usuarios.html"><span class="icon">👤</span> <span>Usuarios</span></a>
                <a class="nav-item active" href="empresas.html"><span class="icon">🏢</span> <span>Empresas</span></a>
                <a class="nav-item" href="../archivos/index.html"><span class="icon">📁</span> <span>Subir Archivos</span></a>
            </nav>

            <div class="user-block">
                <div class="name" id="sidebarUser">Usuario</div>
                <div style="font-size:13px; opacity:0.85;">Encargado de Archivos</div>
                <button class="logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
                <div>
                    <h2 style="margin:0;">Gestión de Empresas</h2>
                    <p style="color:#98a6b2; margin-top:6px;">Administra las empresas registradas en el sistema</p>
                </div>
                <div>
                    <button class="btn btn-primary" id="btnNewCompany" style="display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border-radius:12px;"><span style="font-size:18px;">+</span> Nueva Empresa</button>
                </div>
            </div>

            <div id="alertBox" class="alert alert-danger" style="display:none; margin-top:14px;"></div>

            <div class="companies-grid" id="companiesGrid"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <form id="modalForm">
                <div class="form-group"><label>Razón social</label><input type="text" id="f_nombre" required></div>
                <div class="form-group"><label>RUC</label><input type="text" id="f_ruc"></div>
                <div class="form-group"><label>Dirección</label><input type="text" id="f_dir"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var SERVICE_ROLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtcXF5YnpucHlwZHdmc2N1emR1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDA0NjI3NywiZXhwIjoyMDk5NjIyMjc3fQ.lwY-bTlP_0cQuIxVbWu45V3VQj_ftfBc1b2IlsXYatA';
        var editingId = null;

        function authHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SERVICE_ROLE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            };
        }

        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

        async function renderCompanies() {
            var grid = document.getElementById('companiesGrid');
            grid.innerHTML = '';
            var res = await supabase.from('empresas').select('*').order('id', { ascending: true });
            if (res.error) { grid.innerHTML = '<div class="empty-state">Error al cargar empresas</div>'; return; }
            var data = res.data || [];
            if (!data.length) {
                grid.innerHTML = '<div class="empty-state" style="padding:40px;text-align:center;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(20,30,60,0.04);">'
                    + '<h3 style="color:#203a43;margin-bottom:8px;">Aquí puedes agregar empresas</h3>'
                    + '<p style="color:#97a0aa;margin-bottom:18px;">Aún no se han registrado empresas. Presiona el botón para crear la primera empresa en el sistema.</p>'
                    + '<button class="btn btn-primary" onclick="openModal()">Nueva Empresa</button>'
                + '</div>';
                return;
            }

            await Promise.all(data.map(async function (e) {
                var usersCount = 0, trabCount = 0;
                try {
                    var u = await supabase.from('usuarios').select('id').eq('empresa_id', e.id);
                    usersCount = (u && u.data) ? u.data.length : 0;
                } catch (_) { usersCount = 0; }
                try {
                    var t = await supabase.from('trabajadores').select('id').eq('empresa_id', e.id);
                    trabCount = (t && t.data) ? t.data.length : 0;
                } catch (_) { trabCount = 0; }

                var html = '<div class="company-card">'
                    + '<div class="card-top">'
                        + '<div class="logo">🏢</div>'
                        + '<div class="badge">ACTIVA</div>'
                    + '</div>'
                    + '<div class="card-body">'
                        + '<h3>' + escHtml(e.nombre) + '</h3>'
                        + '<div class="field"><div style="width:36px;height:36px;border-radius:8px;background:#f3eefc;display:flex;align-items:center;justify-content:center;">ID</div><div><strong>RUC</strong><div class="value">' + escHtml(e.ruc || '-') + '</div></div></div>'
                        + '<div class="field"><div style="width:36px;height:36px;border-radius:8px;background:#fff2f2;display:flex;align-items:center;justify-content:center;">📍</div><div><strong>DIRECCIÓN</strong><div class="value">' + escHtml(e.direccion || '-') + '</div></div></div>'
                        + '<div class="stats">'
                            + '<div class="mini-stat"><div class="ico">👤</div><div><div class="num">' + usersCount + '</div><div style="font-size:12px;color:#97a0aa;">USUARIOS</div></div></div>'
                            + '<div class="mini-stat"><div class="ico">👥</div><div><div class="num">' + trabCount + '</div><div style="font-size:12px;color:#97a0aa;">TRABAJADORES</div></div></div>'
                        + '</div>'
                        + '<div class="actions">'
                            + '<button class="btn-edit" onclick="editar(' + e.id + ')">✏️ Editar</button>'
                            + '<button class="btn-delete" onclick="eliminar(' + e.id + ')">🗑️ Eliminar</button>'
                        + '</div>'
                    + '</div>'
                + '</div>';

                var div = document.createElement('div'); div.innerHTML = html;
                grid.appendChild(div.firstChild);
            }));
        }

        function openModal(data) {
            editingId = data ? data.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = data ? 'Editar Empresa' : 'Nueva Empresa';
            document.getElementById('modalSubmit').textContent = data ? 'Guardar cambios' : 'Crear';
            document.getElementById('f_nombre').value = data ? data.nombre : '';
            document.getElementById('f_ruc').value = data ? (data.ruc || '') : '';
            document.getElementById('f_dir').value = data ? (data.direccion || '') : '';
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

        document.getElementById('modalForm').addEventListener('submit', async function (ev) {
            ev.preventDefault();
            var btn = document.getElementById('modalSubmit'); btn.disabled = true; btn.textContent = 'Guardando...';
            try {
                var nombre = document.getElementById('f_nombre').value.trim();
                var ruc = document.getElementById('f_ruc').value.trim();
                var dir = document.getElementById('f_dir').value.trim();
                if (!nombre) { showAlert('La razón social es obligatoria'); btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear'; return; }

                var url = SUPABASE_URL + '/rest/v1/empresas';
                if (editingId) {
                    url += '?id=eq.' + editingId;
                    var res = await fetch(url, {
                        method: 'PATCH',
                        headers: authHeaders(),
                        body: JSON.stringify({ nombre: nombre, ruc: ruc, direccion: dir })
                    });
                    if (!res.ok) { var e = await res.json(); throw new Error(e.message || 'Error al actualizar'); }
                    showAlert('Empresa actualizada', 'success');
                } else {
                    var res = await fetch(url, {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({ nombre: nombre, ruc: ruc, direccion: dir })
                    });
                    if (!res.ok) { var e = await res.json(); throw new Error(e.message || 'Error al crear'); }
                    showAlert('Empresa creada', 'success');
                }
                closeModal(); renderCompanies();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); } finally { btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear'; }
        });

        async function editar(id) {
            var r = await supabase.from('empresas').select('*').eq('id', id).single();
            if (r.error) { showAlert('Error al cargar'); return; }
            openModal(r.data);
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar esta empresa?\nLos trabajadores asociados quedarán sin empresa.')) return;
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/empresas?id=eq.' + id, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (!res.ok) { var e = await res.json(); throw new Error(e.message || 'Error al eliminar'); }
                showAlert('Empresa eliminada', 'success'); renderCompanies();
            } catch (e) { showAlert('Error: ' + (e.message || 'Desconocido')); }
        }

        (async function () {
            var session = await checkAuth(); if (!session) return;
            var profile = await getUserProfile(); if (!profile || profile.rol_id !== 1) { window.location.href = '/index.html'; return; }
            document.getElementById('sidebarUser').textContent = profile.usuario;
            // vincular botón superior
            var btn = document.getElementById('btnNewCompany'); if (btn) btn.addEventListener('click', function(){ openModal(); });
            renderCompanies();
        })();
    </script>
</body>
</html>
