<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Empresas</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
</head>
<body>
    <header style="display:none"></header>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <div>
                <h2 style="margin:0;">Gestión de Empresas</h2>
                <p style="color:#98a6b2; margin-top:6px;">Administra las empresas registradas en el sistema</p>
            </div>
            <div>
                <button class="btn btn-primary" onclick="openModal()" style="display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border-radius:12px;"><span style="font-size:18px;">+</span> Nueva Empresa</button>
            </div>
        </div>

        <div id="alertBox" class="alert alert-danger" style="display:none; margin-top:14px;"></div>

        <div class="companies-grid" id="companiesGrid"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <form id="modalForm">
                <div class="form-group"><label>Nombre de la empresa</label><input type="text" id="f_nombre" required></div>
                <div class="form-group"><label>RUC</label><input type="text" id="f_ruc"></div>
                <div class="form-group"><label>Dirección</label><input type="text" id="f_dir"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var editingId = null;

        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

        async function renderCompanies() {
            var grid = document.getElementById('companiesGrid');
            grid.innerHTML = '';
            var res = await supabase.from('empresas').select('*').order('id', { ascending: true });
            if (res.error) { grid.innerHTML = '<div class="empty-state">Error al cargar empresas</div>'; return; }
            var data = res.data || [];
            if (!data.length) { grid.innerHTML = '<div class="empty-state">No hay empresas</div>'; return; }

            await Promise.all(data.map(async function (e) {
                var usersCount = 0, trabCount = 0;
                try {
                    var u = await supabase.from('usuarios').select('id').eq('empresa_id', e.id);
                    usersCount = (u && u.data) ? u.data.length : 0;
                } catch (_) { usersCount = 0; }
                try {
                    var t = await supabase.from('trabajadores').select('id').eq('empresa_id', e.id);
                    trabCount = (t && t.data) ? t.data.length : 0;
                } catch (_) { trabCount = 0; }

                var html = '<div class="company-card">'
                    + '<div class="card-top">'
                        + '<div class="logo">🏢</div>'
                        + '<div class="badge">ACTIVA</div>'
                    + '</div>'
                    + '<div class="card-body">'
                        + '<h3>' + escHtml(e.nombre) + '</h3>'
                        + '<div class="field"><div style="width:36px;height:36px;border-radius:8px;background:#f3eefc;display:flex;align-items:center;justify-content:center;">ID</div><div><strong>RUC</strong><div class="value">' + escHtml(e.ruc || '-') + '</div></div></div>'
                        + '<div class="field"><div style="width:36px;height:36px;border-radius:8px;background:#fff2f2;display:flex;align-items:center;justify-content:center;">📍</div><div><strong>DIRECCIÓN</strong><div class="value">' + escHtml(e.direccion || '-') + '</div></div></div>'
                        + '<div class="stats">'
                            + '<div class="mini-stat"><div class="ico">👤</div><div><div class="num">' + usersCount + '</div><div style="font-size:12px;color:#97a0aa;">USUARIOS</div></div></div>'
                            + '<div class="mini-stat"><div class="ico">👥</div><div><div class="num">' + trabCount + '</div><div style="font-size:12px;color:#97a0aa;">TRABAJADORES</div></div></div>'
                        + '</div>'
                        + '<div class="actions">'
                            + '<button class="btn-edit" onclick="editar(' + e.id + ')">✏️ Editar</button>'
                            + '<button class="btn-deactivate" onclick="desactivar(' + e.id + ')">🔒 Desactivar</button>'
                        + '</div>'
                    + '</div>'
                + '</div>';

                var div = document.createElement('div'); div.innerHTML = html;
                grid.appendChild(div.firstChild);
            }));
        }

        function openModal(data) {
            editingId = data ? data.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = data ? 'Editar Empresa' : 'Nueva Empresa';
            document.getElementById('modalSubmit').textContent = data ? 'Guardar cambios' : 'Crear';
            document.getElementById('f_nombre').value = data ? data.nombre : '';
            document.getElementById('f_ruc').value = data ? (data.ruc || '') : '';
            document.getElementById('f_dir').value = data ? (data.direccion || '') : '';
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

        document.getElementById('modalForm').addEventListener('submit', async function (ev) {
            ev.preventDefault();
            var btn = document.getElementById('modalSubmit'); btn.disabled = true; btn.textContent = 'Guardando...';
            try {
                var nombre = document.getElementById('f_nombre').value.trim();
                var ruc = document.getElementById('f_ruc').value.trim();
                var dir = document.getElementById('f_dir').value.trim();
                if (!nombre) { showAlert('El nombre es obligatorio'); btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear'; return; }
                if (editingId) {
                    var upd = await supabase.from('empresas').update({ nombre: nombre, ruc: ruc, direccion: dir }).eq('id', editingId);
                    if (upd.error) throw upd.error;
                    showAlert('Empresa actualizada', 'success');
                } else {
                    var ins = await supabase.from('empresas').insert({ nombre: nombre, ruc: ruc, direccion: dir });
                    if (ins.error) throw ins.error;
                    showAlert('Empresa creada', 'success');
                }
                closeModal(); renderCompanies();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); } finally { btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear'; }
        });

        async function editar(id) {
            var r = await supabase.from('empresas').select('*').eq('id', id).single();
            if (r.error) { showAlert('Error al cargar'); return; }
            openModal(r.data);
        }

        async function desactivar(id) {
            if (!confirm('¿Desactivar esta empresa?')) return;
            // Aquí cambiamos un flag 'activa' si existe, si no, borramos
            try {
                var upd = await supabase.from('empresas').update({ activa: false }).eq('id', id);
                if (upd.error) throw upd.error;
                showAlert('Empresa desactivada', 'success'); renderCompanies();
            } catch (e) { showAlert('Error: ' + (e.message || 'Desconocido')); }
        }

        (async function () {
            var session = await checkAuth(); if (!session) return;
            var profile = await getUserProfile(); if (!profile || profile.rol_id !== 1) { window.location.href = '/index.html'; return; }
            renderCompanies();
        })();
    </script>
</body>
</html>
