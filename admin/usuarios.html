<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios · Centro Médico Belén</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menú">☰</button>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-logo">CB</div>
                <div class="sidebar-brand-text">
                    <h2>Centro Médico<br>Belén</h2>
                    <span>Panel Administrativo</span>
                </div>
            </div>

            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="sidebarAvatar">A</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUser">Usuario</div>
                    <div class="sidebar-user-role">Administrador</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-nav-section">Principal</div>
                <a class="nav-item" href="index.html">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a class="nav-item" href="empresas.html">
                    <span class="nav-icon">🏢</span> Empresas
                </a>
                <a class="nav-item" href="trabajadores.html">
                    <span class="nav-icon">👷</span> Trabajadores
                </a>
                <a class="nav-item active" href="usuarios.html">
                    <span class="nav-icon">👤</span> Usuarios
                </a>

                <div class="sidebar-nav-section">Documentos</div>
                <a class="nav-item" href="../archivos/index.html">
                    <span class="nav-icon">📁</span> Subir Archivos
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-header-left">
                    <h1>Gestión de Usuarios</h1>
                    <p>Administra los usuarios del sistema y sus roles</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" onclick="openModal()">
                        <span>+</span> Nuevo Usuario
                    </button>
                </div>
            </div>

            <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Nuevo Usuario</h3>
            <form id="modalForm">
                <div class="form-group">
                    <label for="f_usuario">Usuario</label>
                    <input type="text" id="f_usuario" class="form-control" required>
                </div>
                <div class="form-group" id="pwGroup">
                    <label for="f_password">Contraseña</label>
                    <input type="password" id="f_password" class="form-control" minlength="6">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="f_rol_id">Rol</label>
                        <select id="f_rol_id" class="form-control">
                            <option value="1">Administrativo</option>
                            <option value="2">Médico</option>
                            <option value="3">Archivos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f_estado">Estado</label>
                        <select id="f_estado" class="form-control">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var SERVICE_ROLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtcXF5YnpucHlwZHdmc2N1emR1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDA0NjI3NywiZXhwIjoyMDk5NjIyMjc3fQ.lwY-bTlP_0cQuIxVbWu45V3VQj_ftfBc1b2IlsXYatA';
        var editingId = null;

        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'flex';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

        async function cargar() {
            var _a = await supabase.from('usuarios').select('id, usuario, rol_id, rol, estado').order('id', { ascending: true });
            var data = _a.data, error = _a.error;
            var tbody = document.getElementById('tablaBody');
            if (error) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--slate-500);">Error al cargar</td></tr>'; return; }
            if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--slate-500);">No hay usuarios registrados</td></tr>'; return; }
            var h = '';
            data.forEach(function (u) {
                var rc = u.rol_id === 1 ? 'badge-admin' : u.rol_id === 2 ? 'badge-medico' : 'badge-archivos';
                var ec = u.estado === 1 ? 'badge-active' : 'badge-inactive';
                var es = u.estado === 1 ? 'Activo' : 'Inactivo';
                h += '<tr>'
                    + '<td style="font-weight:600;color:var(--slate-500);">#' + u.id + '</td>'
                    + '<td><strong>' + escHtml(u.usuario) + '</strong></td>'
                    + '<td><span class="badge ' + rc + '">' + escHtml(u.rol) + '</span></td>'
                    + '<td><span class="badge ' + ec + '">' + es + '</span></td>'
                    + '<td><div class="table-actions">'
                        + '<button class="btn-sm-edit" onclick="editar(' + u.id + ')">✏️ Editar</button>'
                        + '<button class="btn-sm-delete" onclick="eliminar(' + u.id + ')">🗑️ Eliminar</button>'
                    + '</div></td>'
                + '</tr>';
            });
            tbody.innerHTML = h;
        }

        function openModal(data) {
            editingId = data ? data.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = data ? 'Editar Usuario' : 'Nuevo Usuario';
            document.getElementById('modalSubmit').textContent = data ? 'Guardar cambios' : 'Crear usuario';
            document.getElementById('f_usuario').value = data ? data.usuario : '';
            document.getElementById('f_password').value = '';
            document.getElementById('f_password').required = !data;
            document.getElementById('pwGroup').style.display = data ? 'none' : '';
            document.getElementById('f_rol_id').value = data ? data.rol_id : 1;
            document.getElementById('f_estado').value = data ? data.estado : 1;
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

        document.getElementById('modalForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('modalSubmit');
            btn.disabled = true; btn.textContent = 'Guardando...';
            try {
                var usuario = document.getElementById('f_usuario').value.trim();
                var rol_id = parseInt(document.getElementById('f_rol_id').value);
                var estado = parseInt(document.getElementById('f_estado').value);
                var roles = { 1: 'administrativo', 2: 'medico', 3: 'archivos' };
                if (editingId) {
                    var _a = await supabase.from('usuarios').update({ usuario: usuario, rol_id: rol_id, rol: roles[rol_id], estado: estado }).eq('id', editingId);
                    if (_a.error) throw _a.error;
                    showAlert('Usuario actualizado correctamente', 'success');
                } else {
                    var password = document.getElementById('f_password').value;
                    if (!password) { showAlert('La contraseña es obligatoria'); btn.disabled = false; btn.textContent = 'Crear usuario'; return; }
                    var email = usuario + '@belen.com';
                    var r1 = await fetch(SUPABASE_URL + '/auth/v1/admin/users', { method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SERVICE_ROLE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password, email_confirm: true, user_metadata: { usuario: usuario, rol_id: rol_id, rol: roles[rol_id] } }) });
                    var d1 = await r1.json();
                    if (!r1.ok) throw new Error(d1.msg || 'Error al crear en Auth');
                    var _b = await supabase.from('usuarios').insert({ usuario: usuario, password: '', rol_id: rol_id, rol: roles[rol_id], estado: estado });
                    if (_b.error) throw _b.error;
                    showAlert('Usuario creado correctamente', 'success');
                }
                closeModal(); cargar();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); } finally { btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear usuario'; }
        });

        async function editar(id) {
            var _a = await supabase.from('usuarios').select('*').eq('id', id).single();
            if (_a.error) { showAlert('Error al cargar'); return; }
            openModal(_a.data);
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este usuario? También se eliminará del sistema de autenticación.')) return;
            try {
                var _a = await supabase.from('usuarios').select('usuario').eq('id', id).single();
                if (_a.error) throw _a.error;
                var email = _a.data.usuario + '@belen.com';
                var r1 = await fetch(SUPABASE_URL + '/auth/v1/admin/users?email=' + encodeURIComponent(email), { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SERVICE_ROLE_KEY } });
                var d1 = await r1.json();
                if (d1 && d1.users && d1.users[0]) { await fetch(SUPABASE_URL + '/auth/v1/admin/users/' + d1.users[0].id, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SERVICE_ROLE_KEY } }); }
                var _b = await supabase.from('usuarios').delete().eq('id', id);
                if (_b.error) throw _b.error;
                showAlert('Usuario eliminado', 'success'); cargar();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); }
        }

        (async function () {
            var session = await checkAuth();
            if (!session) return;
            var profile = await getUserProfile();
            if (!profile || profile.rol_id !== 1) { window.location.href = '/index.html'; return; }
            document.getElementById('sidebarUser').textContent = profile.usuario;
            document.getElementById('sidebarAvatar').textContent = profile.usuario.charAt(0).toUpperCase();
            document.getElementById('sidebarToggle').addEventListener('click', function () {
                document.getElementById('sidebar').classList.toggle('open');
            });
            cargar();
        })();
    </script>
</body>
</html>
