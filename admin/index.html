<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
    <style>
        .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid #e0e0e0; }
        .tab { padding: 12px 24px; cursor: pointer; border: none; background: none; font-size: 15px; font-weight: 600; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s; }
        .tab:hover { color: #203a43; }
        .tab.active { color: #203a43; border-bottom-color: #203a43; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f4f6f9; font-weight: 600; color: #203a43; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
        td { font-size: 14px; }
        tr:hover td { background: #f8f9fc; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; width: auto; font-weight: 600; }
        .btn-add { background: #203a43; color: white; padding: 10px 20px; }
        .btn-add:hover { opacity: .9; }
        .btn-edit { background: #2d6a9f; color: white; }
        .btn-edit:hover { opacity: .9; }
        .btn-delete { background: #c0392b; color: white; }
        .btn-delete:hover { opacity: .9; }
        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 90%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .modal h3 { color: #203a43; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .modal input, .modal select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { width: auto; padding: 10px 24px; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-cancel:hover { background: #ddd; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-admin { background: #203a43; color: white; }
        .badge-medico { background: #2d6a9f; color: white; }
        .badge-archivos { background: #e67e22; color: white; }
        .badge-active { background: #27ae60; color: white; }
        .badge-inactive { background: #ccc; color: #666; }
        .alert { margin-bottom: 16px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>Panel Administrativo</h2>
            <span class="user-info" id="userInfo"></span>
        </div>
        <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
    </header>

    <div class="container">
        <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

        <div class="tabs">
            <button class="tab active" data-tab="usuarios">Usuarios</button>
            <button class="tab" data-tab="empresas">Empresas</button>
            <button class="tab" data-tab="trabajadores">Trabajadores</button>
        </div>

        <!-- USUARIOS -->
        <div class="tab-content active" id="tab-usuarios">
            <div class="toolbar">
                <h2 style="margin:0;">Usuarios</h2>
                <button class="btn btn-add" onclick="openModal('usuario')">+ Nuevo Usuario</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="usuariosTable"></tbody>
                </table>
            </div>
        </div>

        <!-- EMPRESAS -->
        <div class="tab-content" id="tab-empresas">
            <div class="toolbar">
                <h2 style="margin:0;">Empresas</h2>
                <button class="btn btn-add" onclick="openModal('empresa')">+ Nueva Empresa</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Creado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="empresasTable"></tbody>
                </table>
            </div>
        </div>

        <!-- TRABAJADORES -->
        <div class="tab-content" id="tab-trabajadores">
            <div class="toolbar">
                <h2 style="margin:0;">Trabajadores</h2>
                <button class="btn btn-add" onclick="openModal('trabajador')">+ Nuevo Trabajador</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nombres</th><th>Apellidos</th><th>Empresa</th><th>Creado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="trabajadoresTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <form id="modalForm">
                <div id="modalFields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // Service Role Key (para crear/eliminar usuarios en Auth)
        // ============================================================
        var SERVICE_ROLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtcXF5YnpucHlwZHdmc2N1emR1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDA0NjI3NywiZXhwIjoyMDk5NjIyMjc3fQ.lwY-bTlP_0cQuIxVbWu45V3VQj_ftfBc1b2IlsXYatA';

        var profile = null;
        var editingId = null;
        var currentEntity = null;
        var empresasCache = [];

        // ---- Helpers ----
        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ---- Tabs ----
        document.querySelectorAll('.tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                loadData(tab.dataset.tab);
            });
        });

        // ---- Load data ----
        function loadData(entity) {
            if (entity === 'usuarios') loadUsuarios();
            else if (entity === 'empresas') loadEmpresas();
            else if (entity === 'trabajadores') loadTrabajadores();
        }

        async function loadUsuarios() {
            var tbody = document.getElementById('usuariosTable');
            var _a = await supabase.from('usuarios').select('id, usuario, rol_id, rol, estado').order('id', { ascending: true });
            var data = _a.data, error = _a.error;
            if (error) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Error al cargar</td></tr>'; return; }
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No hay usuarios</td></tr>'; return; }
            var html = '';
            data.forEach(function (u) {
                var rolClass = u.rol_id === 1 ? 'badge-admin' : u.rol_id === 2 ? 'badge-medico' : 'badge-archivos';
                var estClass = u.estado === 1 ? 'badge-active' : 'badge-inactive';
                var estText = u.estado === 1 ? 'Activo' : 'Inactivo';
                html += '<tr>' +
                    '<td>' + u.id + '</td>' +
                    '<td><strong>' + escHtml(u.usuario) + '</strong></td>' +
                    '<td><span class="badge ' + rolClass + '">' + escHtml(u.rol) + '</span></td>' +
                    '<td><span class="badge ' + estClass + '">' + estText + '</span></td>' +
                    '<td>' +
                    '<button class="btn-sm btn-edit" onclick="editUsuario(' + u.id + ')">Editar</button> ' +
                    '<button class="btn-sm btn-delete" onclick="deleteUsuario(' + u.id + ')">Eliminar</button>' +
                    '</td></tr>';
            });
            tbody.innerHTML = html;
        }

        async function loadEmpresas() {
            var tbody = document.getElementById('empresasTable');
            var _a = await supabase.from('empresas').select('id, nombre, created_at').order('id', { ascending: true });
            var data = _a.data, error = _a.error;
            if (error) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Error al cargar</td></tr>'; return; }
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No hay empresas</td></tr>'; return; }
            var html = '';
            data.forEach(function (e) {
                var fecha = e.created_at ? new Date(e.created_at).toLocaleDateString() : '-';
                html += '<tr>' +
                    '<td>' + e.id + '</td>' +
                    '<td><strong>' + escHtml(e.nombre) + '</strong></td>' +
                    '<td>' + fecha + '</td>' +
                    '<td>' +
                    '<button class="btn-sm btn-edit" onclick="editEmpresa(' + e.id + ')">Editar</button> ' +
                    '<button class="btn-sm btn-delete" onclick="deleteEmpresa(' + e.id + ')">Eliminar</button>' +
                    '</td></tr>';
            });
            tbody.innerHTML = html;
            // Actualizar cache para los selects de trabajadores
            empresasCache = data || [];
        }

        async function loadTrabajadores() {
            var tbody = document.getElementById('trabajadoresTable');
            var _a = await supabase.from('trabajadores').select('id, nombres, apellidos, empresa_id, created_at').order('id', { ascending: true });
            var data = _a.data, error = _a.error;
            if (error) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Error al cargar</td></tr>'; return; }
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay trabajadores</td></tr>'; return; }
            // Cargar nombres de empresas
            var empMap = {};
            empresasCache.forEach(function (e) { empMap[e.id] = e.nombre; });
            var html = '';
            data.forEach(function (t) {
                var empName = empMap[t.empresa_id] || 'ID: ' + t.empresa_id;
                var fecha = t.created_at ? new Date(t.created_at).toLocaleDateString() : '-';
                html += '<tr>' +
                    '<td>' + t.id + '</td>' +
                    '<td>' + escHtml(t.nombres) + '</td>' +
                    '<td>' + escHtml(t.apellidos) + '</td>' +
                    '<td>' + escHtml(empName) + '</td>' +
                    '<td>' + fecha + '</td>' +
                    '<td>' +
                    '<button class="btn-sm btn-edit" onclick="editTrabajador(' + t.id + ')">Editar</button> ' +
                    '<button class="btn-sm btn-delete" onclick="deleteTrabajador(' + t.id + ')">Eliminar</button>' +
                    '</td></tr>';
            });
            tbody.innerHTML = html;
        }

        // ---- Modal ----
        function openModal(entity, editData) {
            currentEntity = entity;
            editingId = editData ? editData.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = editData ? 'Editar ' + getEntityName(entity) : 'Nuevo ' + getEntityName(entity);
            document.getElementById('modalSubmit').textContent = editData ? 'Guardar cambios' : 'Crear';
            renderModalFields(entity, editData);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            editingId = null;
            currentEntity = null;
        }

        function getEntityName(e) {
            return e === 'usuario' ? 'Usuario' : e === 'empresa' ? 'Empresa' : 'Trabajador';
        }

        function renderModalFields(entity, editData) {
            var container = document.getElementById('modalFields');
            var html = '';
            if (entity === 'usuario') {
                html += '<div class="form-group"><label>Usuario</label><input type="text" id="f_usuario" value="' + escHtml(editData ? editData.usuario : '') + '" required></div>';
                if (!editData) {
                    html += '<div class="form-group"><label>Contraseña</label><input type="password" id="f_password" required minlength="6"></div>';
                }
                html += '<div class="form-group"><label>Rol</label><select id="f_rol_id">' +
                    '<option value="1"' + (editData && editData.rol_id === 1 ? ' selected' : '') + '>Administrativo</option>' +
                    '<option value="2"' + (editData && editData.rol_id === 2 ? ' selected' : '') + '>Médico</option>' +
                    '<option value="3"' + (editData && editData.rol_id === 3 ? ' selected' : '') + '>Archivos</option>' +
                    '</select></div>';
                html += '<div class="form-group"><label>Estado</label><select id="f_estado">' +
                    '<option value="1"' + (editData && editData.estado !== 0 ? ' selected' : '') + '>Activo</option>' +
                    '<option value="0"' + (editData && editData.estado === 0 ? ' selected' : '') + '>Inactivo</option>' +
                    '</select></div>';
            } else if (entity === 'empresa') {
                html += '<div class="form-group"><label>Nombre de la empresa</label><input type="text" id="f_nombre" value="' + escHtml(editData ? editData.nombre : '') + '" required></div>';
            } else if (entity === 'trabajador') {
                html += '<div class="form-group"><label>Nombres</label><input type="text" id="f_nombres" value="' + escHtml(editData ? editData.nombres : '') + '" required></div>';
                html += '<div class="form-group"><label>Apellidos</label><input type="text" id="f_apellidos" value="' + escHtml(editData ? editData.apellidos : '') + '" required></div>';
                var opts = '<option value="">-- Seleccione --</option>';
                empresasCache.forEach(function (e) {
                    opts += '<option value="' + e.id + '"' + (editData && editData.empresa_id === e.id ? ' selected' : '') + '>' + escHtml(e.nombre) + '</option>';
                });
                html += '<div class="form-group"><label>Empresa</label><select id="f_empresa_id" required>' + opts + '</select></div>';
            }
            container.innerHTML = html;
        }

        // ---- Modal Submit ----
        document.getElementById('modalForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('modalSubmit');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                if (currentEntity === 'usuario') {
                    await saveUsuario();
                } else if (currentEntity === 'empresa') {
                    await saveEmpresa();
                } else if (currentEntity === 'trabajador') {
                    await saveTrabajador();
                }
                closeModal();
                loadData(currentEntity);
            } catch (err) {
                showAlert('Error: ' + (err.message || 'Desconocido'));
            } finally {
                btn.disabled = false;
                btn.textContent = editingId ? 'Guardar cambios' : 'Crear';
            }
        });

        // ---- CRUD Usuarios ----
        async function saveUsuario() {
            var usuario = document.getElementById('f_usuario').value.trim();
            var rol_id = parseInt(document.getElementById('f_rol_id').value);
            var estado = parseInt(document.getElementById('f_estado').value);
            var roles = { 1: 'administrativo', 2: 'medico', 3: 'archivos' };

            if (editingId) {
                // UPDATE solo en tabla pública
                var _a = await supabase.from('usuarios').update({ usuario: usuario, rol_id: rol_id, rol: roles[rol_id], estado: estado }, { count: 'exact' }).eq('id', editingId);
                if (_a.error) throw _a.error;
                showAlert('Usuario actualizado', 'success');
            } else {
                // CREATE: 1) en Auth, 2) en tabla pública
                var password = document.getElementById('f_password').value;
                var email = usuario + '@clinica.local';

                // 1) Crear en Auth (usa service_role)
                var authRes = await fetch(SUPABASE_URL + '/auth/v1/admin/users', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SERVICE_ROLE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        email_confirm: true,
                        user_metadata: { usuario: usuario, rol_id: rol_id, rol: roles[rol_id] }
                    })
                });
                var authData = await authRes.json();
                if (!authRes.ok) throw new Error(authData.msg || 'Error al crear usuario en Auth');

                // 2) Insertar en tabla pública
                var _b = await supabase.from('usuarios').insert({
                    usuario: usuario,
                    password: '',  // la contraseña está en Auth
                    rol_id: rol_id,
                    rol: roles[rol_id],
                    estado: estado
                });
                if (_b.error) throw _b.error;
                showAlert('Usuario creado correctamente', 'success');
            }
        }

        async function editUsuario(id) {
            var _a = await supabase.from('usuarios').select('id, usuario, rol_id, rol, estado').eq('id', id).single();
            if (_a.error) { showAlert('Error al cargar usuario'); return; }
            openModal('usuario', _a.data);
        }

        async function deleteUsuario(id) {
            if (!confirm('¿Eliminar este usuario?\nEsto también lo eliminará del sistema de autenticación.')) return;
            try {
                // Obtener usuario para saber el auth_id
                var _a = await supabase.from('usuarios').select('id, usuario').eq('id', id).single();
                if (_a.error) throw _a.error;

                // Eliminar de Auth (usa service_role)
                // Primero obtener el user_id de auth por email
                var email = _a.data.usuario + '@clinica.local';
                var listRes = await fetch(SUPABASE_URL + '/auth/v1/admin/users?email=' + encodeURIComponent(email), {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SERVICE_ROLE_KEY
                    }
                });
                var listData = await listRes.json();
                if (listData && listData.users && listData.users.length > 0) {
                    var userId = listData.users[0].id;
                    await fetch(SUPABASE_URL + '/auth/v1/admin/users/' + userId, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SERVICE_ROLE_KEY
                        }
                    });
                }

                // Eliminar de tabla pública
                var _b = await supabase.from('usuarios').delete().eq('id', id);
                if (_b.error) throw _b.error;
                showAlert('Usuario eliminado', 'success');
                loadUsuarios();
            } catch (err) {
                showAlert('Error al eliminar: ' + (err.message || 'Desconocido'));
            }
        }

        // ---- CRUD Empresas ----
        async function saveEmpresa() {
            var nombre = document.getElementById('f_nombre').value.trim();
            if (!nombre) return showAlert('El nombre es obligatorio');

            if (editingId) {
                var _a = await supabase.from('empresas').update({ nombre: nombre }).eq('id', editingId);
                if (_a.error) throw _a.error;
                showAlert('Empresa actualizada', 'success');
            } else {
                var _b = await supabase.from('empresas').insert({ nombre: nombre });
                if (_b.error) throw _b.error;
                showAlert('Empresa creada', 'success');
            }
        }

        async function editEmpresa(id) {
            var _a = await supabase.from('empresas').select('id, nombre').eq('id', id).single();
            if (_a.error) { showAlert('Error al cargar empresa'); return; }
            openModal('empresa', _a.data);
        }

        async function deleteEmpresa(id) {
            if (!confirm('¿Eliminar esta empresa?\nLos trabajadores asociados quedarán huérfanos.')) return;
            var _a = await supabase.from('empresas').delete().eq('id', id);
            if (_a.error) { showAlert('Error: ' + (_a.error.message || 'No se puede eliminar, tiene trabajadores asociados')); return; }
            showAlert('Empresa eliminada', 'success');
            loadEmpresas();
        }

        // ---- CRUD Trabajadores ----
        async function saveTrabajador() {
            var nombres = document.getElementById('f_nombres').value.trim();
            var apellidos = document.getElementById('f_apellidos').value.trim();
            var empresa_id = parseInt(document.getElementById('f_empresa_id').value);
            if (!nombres || !apellidos || !empresa_id) return showAlert('Completá todos los campos');

            if (editingId) {
                var _a = await supabase.from('trabajadores').update({ nombres: nombres, apellidos: apellidos, empresa_id: empresa_id }).eq('id', editingId);
                if (_a.error) throw _a.error;
                showAlert('Trabajador actualizado', 'success');
            } else {
                var _b = await supabase.from('trabajadores').insert({ nombres: nombres, apellidos: apellidos, empresa_id: empresa_id });
                if (_b.error) throw _b.error;
                showAlert('Trabajador creado', 'success');
            }
        }

        async function editTrabajador(id) {
            var _a = await supabase.from('trabajadores').select('id, nombres, apellidos, empresa_id').eq('id', id).single();
            if (_a.error) { showAlert('Error al cargar trabajador'); return; }
            openModal('trabajador', _a.data);
        }

        async function deleteTrabajador(id) {
            if (!confirm('¿Eliminar este trabajador?')) return;
            var _a = await supabase.from('trabajadores').delete().eq('id', id);
            if (_a.error) { showAlert('Error al eliminar'); return; }
            showAlert('Trabajador eliminado', 'success');
            loadTrabajadores();
        }

        // ---- Init ----
        (async function () {
            try {
                var session = await checkAuth();
                if (!session) return;

                profile = await getUserProfile();
                if (!profile || profile.rol_id !== 1) {
                    window.location.href = '/index.html';
                    return;
                }
                document.getElementById('userInfo').textContent = profile.usuario + ' · ' + profile.rol;

                // Cargar empresas primero (necesario para selects)
                var _a = await supabase.from('empresas').select('id, nombre').order('id');
                empresasCache = _a.data || [];

                loadUsuarios();
            } catch (err) {
                console.error('Error en init:', err);
                showAlert('Error al cargar el panel');
            }
        })();
    </script>
</body>
</html>
