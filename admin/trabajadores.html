<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Trabajadores</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
    <style>
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f4f6f9; font-weight: 600; color: #203a43; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
        td { font-size: 14px; }
        tr:hover td { background: #f8f9fc; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; width: auto; font-weight: 600; }
        .btn-add { background: #203a43; color: white; padding: 10px 20px; }
        .btn-add:hover { opacity: .9; }
        .btn-edit { background: #2d6a9f; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .back-link { color: #203a43; text-decoration: none; font-weight: 600; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 90%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .modal h3 { color: #203a43; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .modal input, .modal select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { width: auto; padding: 10px 24px; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-cancel:hover { background: #ddd; }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>Gestión de Trabajadores</h2>
            <span class="user-info" id="userInfo"></span>
        </div>
        <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">← Volver al dashboard</a>
        <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

        <div class="toolbar">
            <h2 style="margin:0;">Trabajadores</h2>
            <button class="btn btn-add" onclick="openModal()">+ Nuevo Trabajador</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombres</th><th>Apellidos</th><th>Empresa</th><th>Creado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <form id="modalForm">
                <div class="form-group"><label>Nombres</label><input type="text" id="f_nombres" required></div>
                <div class="form-group"><label>Apellidos</label><input type="text" id="f_apellidos" required></div>
                <div class="form-group">
                    <label>Empresa</label>
                    <select id="f_empresa_id" required><option value="">-- Seleccione --</option></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var editingId = null;
        var empresas = [];

        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

        async function cargarEmpresas() {
            var _a = await supabase.from('empresas').select('id, nombre').order('id');
            empresas = _a.data || [];
            var sel = document.getElementById('f_empresa_id');
            sel.innerHTML = '<option value="">-- Seleccione --</option>';
            empresas.forEach(function (e) { sel.innerHTML += '<option value="' + e.id + '">' + escHtml(e.nombre) + '</option>'; });
        }

        async function cargar() {
            await cargarEmpresas();
            var _a = await supabase.from('trabajadores').select('id, nombres, apellidos, empresa_id, created_at').order('id', { ascending: true });
            var data = _a.data, error = _a.error;
            var tbody = document.getElementById('tablaBody');
            if (error) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Error al cargar</td></tr>'; return; }
            if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay trabajadores</td></tr>'; return; }
            var empMap = {};
            empresas.forEach(function (e) { empMap[e.id] = e.nombre; });
            var h = '';
            data.forEach(function (t) {
                var f = t.created_at ? new Date(t.created_at).toLocaleDateString() : '-';
                h += '<tr><td>' + t.id + '</td><td>' + escHtml(t.nombres) + '</td><td>' + escHtml(t.apellidos) + '</td><td>' + escHtml(empMap[t.empresa_id] || '-') + '</td><td>' + f + '</td><td><button class="btn-sm btn-edit" onclick="editar(' + t.id + ')">Editar</button> <button class="btn-sm btn-delete" onclick="eliminar(' + t.id + ')">Eliminar</button></td></tr>';
            });
            tbody.innerHTML = h;
        }

        function openModal(data) {
            editingId = data ? data.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = data ? 'Editar Trabajador' : 'Nuevo Trabajador';
            document.getElementById('modalSubmit').textContent = data ? 'Guardar cambios' : 'Crear';
            document.getElementById('f_nombres').value = data ? data.nombres : '';
            document.getElementById('f_apellidos').value = data ? data.apellidos : '';
            document.getElementById('f_empresa_id').value = data ? data.empresa_id : '';
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

        document.getElementById('modalForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('modalSubmit');
            btn.disabled = true; btn.textContent = 'Guardando...';
            try {
                var nombres = document.getElementById('f_nombres').value.trim();
                var apellidos = document.getElementById('f_apellidos').value.trim();
                var empresa_id = parseInt(document.getElementById('f_empresa_id').value);
                if (!nombres || !apellidos || !empresa_id) { showAlert('Completá todos los campos'); btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear'; return; }
                if (editingId) {
                    var _a = await supabase.from('trabajadores').update({ nombres: nombres, apellidos: apellidos, empresa_id: empresa_id }).eq('id', editingId);
                    if (_a.error) throw _a.error;
                    showAlert('Trabajador actualizado', 'success');
                } else {
                    var _b = await supabase.from('trabajadores').insert({ nombres: nombres, apellidos: apellidos, empresa_id: empresa_id });
                    if (_b.error) throw _b.error;
                    showAlert('Trabajador creado', 'success');
                }
                closeModal(); cargar();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); } finally { btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear'; }
        });

        async function editar(id) {
            var _a = await supabase.from('trabajadores').select('*').eq('id', id).single();
            if (_a.error) { showAlert('Error al cargar'); return; }
            openModal(_a.data);
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este trabajador?')) return;
            var _a = await supabase.from('trabajadores').delete().eq('id', id);
            if (_a.error) { showAlert('Error al eliminar'); return; }
            showAlert('Trabajador eliminado', 'success'); cargar();
        }

        (async function () {
            var session = await checkAuth();
            if (!session) return;
            var profile = await getUserProfile();
            if (!profile || profile.rol_id !== 1) { window.location.href = '/index.html'; return; }
            document.getElementById('userInfo').textContent = profile.usuario + ' · ' + profile.rol;
            cargar();
        })();
    </script>
</body>
</html>
