<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajadores · Centro Médico Belén</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menú">☰</button>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-logo">CB</div>
                <div class="sidebar-brand-text">
                    <h2>Centro Médico<br>Belén</h2>
                    <span>Panel Administrativo</span>
                </div>
            </div>

            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="sidebarAvatar">A</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUser">Usuario</div>
                    <div class="sidebar-user-role">Administrador</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-nav-section">Principal</div>
                <a class="nav-item" href="index.html">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a class="nav-item" href="empresas.html">
                    <span class="nav-icon">🏢</span> Empresas
                </a>
                <a class="nav-item active" href="trabajadores.html">
                    <span class="nav-icon">👷</span> Trabajadores
                </a>
                <a class="nav-item" href="usuarios.html">
                    <span class="nav-icon">👤</span> Usuarios
                </a>

                <div class="sidebar-nav-section">Documentos</div>
                <a class="nav-item" href="../archivos/index.html">
                    <span class="nav-icon">📁</span> Subir Archivos
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-header-left">
                    <h1>Gestión de Trabajadores</h1>
                    <p>Registra y administra los trabajadores del sistema</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" onclick="openModal()">
                        <span>+</span> Nuevo Trabajador
                    </button>
                </div>
            </div>

            <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Empresa</th>
                                <th>Creado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Nuevo Trabajador</h3>
            <form id="modalForm">
                <div class="form-group">
                    <label for="f_nombres">Nombres</label>
                    <input type="text" id="f_nombres" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="f_apellidos">Apellidos</label>
                    <input type="text" id="f_apellidos" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="f_empresa_id">Empresa</label>
                    <select id="f_empresa_id" class="form-control" required>
                        <option value="">-- Seleccione --</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var editingId = null;
        var empresas = [];

        function showAlert(msg, type) {
            var box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type || 'danger');
            box.textContent = msg;
            box.style.display = 'flex';
            setTimeout(function () { box.style.display = 'none'; }, 5000);
        }

        function escHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

        async function cargarEmpresas() {
            var _a = await supabase.from('empresas').select('id, nombre').order('id');
            empresas = _a.data || [];
            var sel = document.getElementById('f_empresa_id');
            sel.innerHTML = '<option value="">-- Seleccione --</option>';
            empresas.forEach(function (e) { sel.innerHTML += '<option value="' + e.id + '">' + escHtml(e.nombre) + '</option>'; });
        }

        async function cargar() {
            await cargarEmpresas();
            var _a = await supabase.from('trabajadores').select('id, nombres, apellidos, empresa_id, created_at').order('id', { ascending: true });
            var data = _a.data, error = _a.error;
            var tbody = document.getElementById('tablaBody');
            if (error) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--slate-500);">Error al cargar</td></tr>'; return; }
            if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--slate-500);">No hay trabajadores registrados</td></tr>'; return; }
            var empMap = {};
            empresas.forEach(function (e) { empMap[e.id] = e.nombre; });
            var h = '';
            data.forEach(function (t) {
                var f = t.created_at ? new Date(t.created_at).toLocaleDateString() : '-';
                h += '<tr>'
                    + '<td style="font-weight:600;color:var(--slate-500);">#' + t.id + '</td>'
                    + '<td><strong>' + escHtml(t.nombres) + '</strong></td>'
                    + '<td>' + escHtml(t.apellidos) + '</td>'
                    + '<td>' + escHtml(empMap[t.empresa_id] || '-') + '</td>'
                    + '<td style="color:var(--slate-500);font-size:13px;">' + f + '</td>'
                    + '<td><div class="table-actions">'
                        + '<button class="btn-sm-edit" onclick="editar(' + t.id + ')">✏️ Editar</button>'
                        + '<button class="btn-sm-delete" onclick="eliminar(' + t.id + ')">🗑️ Eliminar</button>'
                    + '</div></td>'
                + '</tr>';
            });
            tbody.innerHTML = h;
        }

        function openModal(data) {
            editingId = data ? data.id : null;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalTitle').textContent = data ? 'Editar Trabajador' : 'Nuevo Trabajador';
            document.getElementById('modalSubmit').textContent = data ? 'Guardar cambios' : 'Crear trabajador';
            document.getElementById('f_nombres').value = data ? data.nombres : '';
            document.getElementById('f_apellidos').value = data ? data.apellidos : '';
            document.getElementById('f_empresa_id').value = data ? data.empresa_id : '';
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

        document.getElementById('modalForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('modalSubmit');
            btn.disabled = true; btn.textContent = 'Guardando...';
            try {
                var nombres = document.getElementById('f_nombres').value.trim();
                var apellidos = document.getElementById('f_apellidos').value.trim();
                var empresa_id = parseInt(document.getElementById('f_empresa_id').value);
                if (!nombres || !apellidos || !empresa_id) { showAlert('Completá todos los campos'); btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear trabajador'; return; }
                if (editingId) {
                    var _a = await supabase.from('trabajadores').update({ nombres: nombres, apellidos: apellidos, empresa_id: empresa_id }).eq('id', editingId);
                    if (_a.error) throw _a.error;
                    showAlert('Trabajador actualizado correctamente', 'success');
                } else {
                    var _b = await supabase.from('trabajadores').insert({ nombres: nombres, apellidos: apellidos, empresa_id: empresa_id });
                    if (_b.error) throw _b.error;
                    showAlert('Trabajador creado correctamente', 'success');
                }
                closeModal(); cargar();
            } catch (err) { showAlert('Error: ' + (err.message || 'Desconocido')); } finally { btn.disabled = false; btn.textContent = editingId ? 'Guardar cambios' : 'Crear trabajador'; }
        });

        async function editar(id) {
            var _a = await supabase.from('trabajadores').select('*').eq('id', id).single();
            if (_a.error) { showAlert('Error al cargar'); return; }
            openModal(_a.data);
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este trabajador?')) return;
            var _a = await supabase.from('trabajadores').delete().eq('id', id);
            if (_a.error) { showAlert('Error al eliminar'); return; }
            showAlert('Trabajador eliminado', 'success'); cargar();
        }

        (async function () {
            var session = await checkAuth();
            if (!session) return;
            var profile = await getUserProfile();
            if (!profile || profile.rol_id !== 1) { window.location.href = '/index.html'; return; }
            document.getElementById('sidebarUser').textContent = profile.usuario;
            document.getElementById('sidebarAvatar').textContent = profile.usuario.charAt(0).toUpperCase();
            document.getElementById('sidebarToggle').addEventListener('click', function () {
                document.getElementById('sidebar').classList.toggle('open');
            });
            cargar();
        })();
    </script>
</body>
</html>
