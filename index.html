<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Centro Médico Belén</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">CB</div>
                <h1>Centro Médico Belén</h1>
                <p>Sistema de Gestión Clínica</p>
            </div>

            <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary btn-lg">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <strong>Centro Médico Belén</strong> · Sistema Clínico v1.0
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (ev) {
            ev.preventDefault();
            var btn = document.getElementById('btnLogin');
            var alertBox = document.getElementById('alertBox');

            btn.disabled = true;
            btn.textContent = 'Ingresando...';

            try {
                var usuario = document.getElementById('usuario').value.trim();
                var password = document.getElementById('password').value.trim();

                if (!usuario || !password) {
                    alertBox.textContent = 'Completa todos los campos';
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    return;
                }

                // Login contra Supabase Auth con email = usuario + "@belen.com"
                var email = usuario + '@belen.com';
                var _a = await supabase.auth.signInWithPassword({ email: email, password: password });
                var data = _a.data, error = _a.error;

                if (error) {
                    alertBox.textContent = error.message || 'Credenciales inválidas';
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    return;
                }

                var profile = await getUserProfile();
                if (!profile) {
                    alertBox.textContent = 'Error al obtener perfil del usuario';
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    return;
                }

                const rutas = {
                    1: '/admin/',
                    2: '/medico/',
                    3: '/archivos/',
                };
                window.location.href = rutas[profile.rol_id] || '/index.html';
            } catch (err) {
                console.error('Error en login:', err);
                alertBox.textContent = 'Error inesperado: ' + err.message;
                alertBox.style.display = 'flex';
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });

        // Si ya hay sesión activa, redirigir
        (async () => {
            try {
                if (typeof supabase === 'undefined' || !supabase) return;
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    const profile = await getUserProfile();
                    if (profile) {
                        const rutas = { 1: '/admin/', 2: '/medico/', 3: '/archivos/' };
                        window.location.href = rutas[profile.rol_id] || '/index.html';
                    }
                }
            } catch (_) { /* silencioso */ }
        })();
    </script>
</body>
</html>
